# Topic catalogue for the lab — the single source of truth used by
# scripts/create-topics.sh (and the kafka-init container on `docker compose up`).
#
# Format:  <topic> <partitions> <replication-factor> [config=value,config=value...]
#
# Why the numbers differ (full reasoning: docs/04-topic-partition.md):
#   orders / payments  6  : 3 consumer instances today, room to scale to 6 without
#                           repartitioning (adding partitions later breaks key->partition).
#   analytics-events   12 : highest fan-in / volume, consumers do cheap batch work and
#                           we want up to 12 parallel workers.
#   notifications      3  : low volume, ordering per user is enough.
#   retry-* / *-dlq    3  : low volume side channels; DLQ needs durability, not throughput.
#   retention-demo     1  : 1 partition so segment files are easy to inspect on disk.
#
# Every production-like topic: RF=3 + min.insync.replicas=2  (survives 1 broker loss
# for writes with acks=all, refuses writes when 2 brokers are gone).

# ---- business event streams (cleanup.policy=delete) -----------------------------
orders                 6   3  min.insync.replicas=2,retention.ms=604800000
payments               6   3  min.insync.replicas=2,retention.ms=604800000
notifications          3   3  min.insync.replicas=2,retention.ms=259200000
analytics-events       12  3  min.insync.replicas=2,retention.ms=259200000
user-events            6   3  min.insync.replicas=2,retention.ms=604800000
inventory-events       6   3  min.insync.replicas=2,retention.ms=604800000

# ---- retry / dead letter (keep longer than the main topic: humans investigate DLQ) ----
retry-orders           3   3  min.insync.replicas=2,retention.ms=1209600000
retry-payments         3   3  min.insync.replicas=2,retention.ms=1209600000
orders-dlq             3   3  min.insync.replicas=2,retention.ms=2592000000
payments-dlq           3   3  min.insync.replicas=2,retention.ms=2592000000

# ---- state topic (latest value per key) ------------------------------------------
# segment.ms / dirty ratio are lowered ONLY so compaction is observable within a minute.
user-profile-compacted 3   3  cleanup.policy=compact,min.insync.replicas=2,segment.ms=15000,min.cleanable.dirty.ratio=0.01,delete.retention.ms=20000,min.compaction.lag.ms=0

# ---- lab-only topics (aggressive configs never applied to the business topics) ----
retention-demo         1   3  min.insync.replicas=2,retention.ms=60000,segment.ms=10000,segment.bytes=1048576,file.delete.delay.ms=5000
ordering-demo          6   3  min.insync.replicas=2,retention.ms=86400000
txn-input              3   3  min.insync.replicas=2,retention.ms=86400000
txn-output             3   3  min.insync.replicas=2,retention.ms=86400000
