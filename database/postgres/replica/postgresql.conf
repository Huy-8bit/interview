# =============================================================================
# PostgreSQL 16 - REPLICA (hot standby) configuration
#
# primary_conninfo and primary_slot_name are NOT set here: pg_basebackup
# --write-recovery-conf writes them into $PGDATA/postgresql.auto.conf, which is
# read after this file. standby.signal (also created by pg_basebackup) is what
# makes the server start in standby mode.
#
# Hot standby rule: max_connections, max_worker_processes, max_wal_senders,
# max_prepared_transactions and max_locks_per_transaction must be >= primary's.
# =============================================================================

# -----------------------------------------------------------------------------
# Connections & authentication
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256
# cluster_name is also the walreceiver's application_name
# -> SELECT application_name FROM pg_stat_replication;  on the primary
cluster_name = 'pglab-replica'

# -----------------------------------------------------------------------------
# Memory / planner (same as primary so plans are comparable)
# -----------------------------------------------------------------------------
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 256MB
effective_cache_size = 1GB
random_page_cost = 1.1
effective_io_concurrency = 200

# -----------------------------------------------------------------------------
# Standby behaviour
# -----------------------------------------------------------------------------
hot_standby = on                            # accept read-only queries during recovery
hot_standby_feedback = on                   # tell primary our oldest xmin -> fewer query cancellations,
                                            # at the price of delaying VACUUM on the primary
max_standby_streaming_delay = 30s           # how long replay may wait for a conflicting query before cancelling it
wal_receiver_status_interval = 1s           # report write/flush/replay positions every second (fresher lag numbers)
wal_receiver_timeout = 60s
# recovery_min_apply_delay = '5min'         # uncomment for a "delayed replica" experiment

# -----------------------------------------------------------------------------
# WAL / sending side (used if this node is promoted or feeds a cascading replica)
# -----------------------------------------------------------------------------
wal_level = replica
wal_log_hints = on
max_wal_size = 2GB
min_wal_size = 256MB
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 512MB
max_slot_wal_keep_size = 4GB
track_commit_timestamp = on

# -----------------------------------------------------------------------------
# Monitoring
# -----------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top
compute_query_id = on
track_io_timing = on
track_activity_query_size = 4096

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_timezone = 'UTC'
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
deadlock_timeout = 1s
log_recovery_conflict_waits = on            # log when replay waits on a standby query
log_replication_commands = on

# -----------------------------------------------------------------------------
# Client defaults
# -----------------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
