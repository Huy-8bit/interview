# =============================================================================
# PostgreSQL 16 - PRIMARY configuration (lab sizing: a few GB of RAM)
# Only non-default / educational settings are listed. Everything else = default.
# Inspect effective values:  SELECT name, setting, source FROM pg_settings WHERE source <> 'default';
# =============================================================================

# -----------------------------------------------------------------------------
# Connections & authentication
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256
cluster_name = 'pglab-primary'              # shows up in `ps` and in logs

# -----------------------------------------------------------------------------
# Memory
# -----------------------------------------------------------------------------
shared_buffers = 256MB                      # PostgreSQL's own page cache
work_mem = 8MB                              # per sort/hash node, per query
maintenance_work_mem = 256MB                # CREATE INDEX, VACUUM
effective_cache_size = 1GB                  # planner hint: shared_buffers + OS cache

# -----------------------------------------------------------------------------
# Planner (SSD-friendly costs; try `SET random_page_cost = 4` to see plans change)
# -----------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# -----------------------------------------------------------------------------
# Write-Ahead Log
# -----------------------------------------------------------------------------
wal_level = replica                         # enough information for physical replication / PITR
wal_log_hints = on                          # required by pg_rewind (re-attach an old primary after failover)
max_wal_size = 2GB                          # checkpoint when this much WAL accumulated...
min_wal_size = 256MB
checkpoint_timeout = 5min                   # ...or after this much time
checkpoint_completion_target = 0.9
synchronous_commit = on
track_commit_timestamp = on                 # pg_xact_commit_timestamp(xmin) - handy for MVCC/replication labs

# -----------------------------------------------------------------------------
# Replication - sending side (this node is the source of WAL)
# -----------------------------------------------------------------------------
max_wal_senders = 10                        # concurrent walsender processes (replicas + pg_basebackup)
max_replication_slots = 10
wal_keep_size = 512MB                       # extra WAL kept for replicas without a slot
max_slot_wal_keep_size = 4GB                # safety cap: a dead replica's slot cannot fill the disk
wal_sender_timeout = 60s
synchronous_standby_names = ''              # '' = asynchronous replication (see docs/replication.md)

# Standby-side settings: ignored while this node is primary, used if it ever
# becomes a standby (e.g. after a failover exercise).
hot_standby = on
hot_standby_feedback = on

# -----------------------------------------------------------------------------
# Monitoring / statistics
# -----------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top
compute_query_id = on
track_io_timing = on                        # I/O timings in EXPLAIN (ANALYZE, BUFFERS) and pg_stat_*
track_activity_query_size = 4096

# -----------------------------------------------------------------------------
# Logging (to stderr -> `docker compose logs postgres-primary`)
# -----------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_timezone = 'UTC'
log_min_duration_statement = 1000           # log statements slower than 1s
log_checkpoints = on
log_lock_waits = on                         # log waits longer than deadlock_timeout
deadlock_timeout = 1s
log_temp_files = 10240                      # log sorts/hashes spilling > 10MB to disk
log_autovacuum_min_duration = 10s
log_replication_commands = on

# -----------------------------------------------------------------------------
# Client defaults
# -----------------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
# Deliberately 0 (disabled) so the transaction/lock labs can hold transactions open.
statement_timeout = 0
idle_in_transaction_session_timeout = 0
