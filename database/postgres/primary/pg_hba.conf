# =============================================================================
# pg_hba.conf - PRIMARY  (Host-Based Authentication)
# First matching line wins. Columns: TYPE  DATABASE  USER  ADDRESS  METHOD
# =============================================================================

# Unix socket inside the container (docker exec ... psql, init scripts, healthcheck)
local   all             all                                     trust
# ...and physical replication over the socket (pg_basebackup run inside the container).
# "all" in the DATABASE column never matches replication connections.
local   replication     all                                     trust

# Loopback inside the container
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Streaming replication / pg_basebackup.
# "replication" is a pseudo-database meaning "a physical replication connection".
# "all" users is safe here: only roles with the REPLICATION attribute (or superuser)
# may open a replication connection. "samenet" = any subnet this server is on,
# i.e. the Docker network the replica lives in.
host    replication     all             samenet                 scram-sha-256

# Normal client connections (DBeaver, psql, the data generator...)
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256
