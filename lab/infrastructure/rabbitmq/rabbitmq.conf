## Three-node lab cluster. Every node lists the same seed set; the first node to
## boot forms the cluster and the others join it (classic peer discovery).
cluster_name = vehicle-lab-rabbitmq
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

## A minority side of a network partition stops serving clients, so publishers and
## workers reconnect to the majority instead of diverging.
cluster_partition_handling = pause_minority

## Spread new quorum queue leaders across nodes instead of the declaring node.
queue_leader_locator = balanced

## Explicit, visible limits for dashboards and alarms (bytes). Without them each
## node would size itself from the whole Docker VM.
vm_memory_high_watermark.absolute = 1073741824
disk_free_limit.absolute = 1000000000

## Aggregated /metrics stays cheap; per-queue series come from /metrics/detailed.
prometheus.return_per_object_metrics = false
